name: Release

on:
  push:
    branches: [master]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Open release PR / cut tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      paths_released: ${{ steps.release.outputs.paths_released }}
      release_outputs: ${{ toJSON(steps.release.outputs) }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json

  publish:
    name: Start npm publication
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        path: ${{ fromJSON(needs.release-please.outputs.paths_released) }}
    steps:
      # A separate run keeps the OIDC workflow identity set to rescue.yml.
      - name: Start trusted publishing workflow
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WORKFLOW_REF: ${{ github.ref_name }}
          PACKAGE_PATH: ${{ matrix.path }}
          RELEASE_TAG: ${{ fromJSON(needs.release-please.outputs.release_outputs)[format('{0}--tag_name', matrix.path)] }}
        run: |
          if [[ -z "$RELEASE_TAG" ]]; then
            echo "No release tag was returned for ${PACKAGE_PATH}." >&2
            exit 1
          fi
          gh workflow run rescue.yml \
            --ref "$WORKFLOW_REF" \
            -f package_path="$PACKAGE_PATH" \
            -f tag_name="$RELEASE_TAG" \
            -f frozen_lockfile=true
          printf 'Publication of %s from %s was dispatched to Rescue Publish. Check that workflow run for the npm publication result.\n' \
            "$RELEASE_TAG" "$PACKAGE_PATH" >> "$GITHUB_STEP_SUMMARY"
